<!doctype html>
<html ng-app="workStore">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <title>Experiences - Mahir Kothary</title>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap' rel='stylesheet' type='text/css'>
    <link rel="icon" href="/assets/images/transparent.png">
    <link rel="stylesheet" type="text/css" href="/assets/stylesheets/font-awesome-4.2.0/css/font-awesome.css">
    <link rel="stylesheet" type="text/css" href="/assets/stylesheets/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js"></script>
    <script src="/assets/js/data.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/work-experience.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  </head>
  <body ng-controller="StoreController as store">
    <div class="container">
      <header class="header">
        <h1>MAHIR KOTHARY</h1>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/work/">Experiences</a>
          <a href="/about/">About</a>
          <a href="/blog/" target="_blog">Blog</a>
          <a href="/resume/" target="_resume">Resume</a>
        </nav>
      </header>

      <div class="page-title">
        <h2>Experiences</h2>
      </div>

      <div class="timeline work-timeline">
        <div class="timeline-item" ng-repeat="work in experiences">
          <div class="timeline-marker" ng-class="work.type">
            <i class="fa" ng-class="{
              'fa-briefcase': work.type === 'work',
              'fa-graduation-cap': work.type === 'education', 
              'fa-users': work.type === 'leadership'
            }"></i>
          </div>
          <div class="timeline-content" ng-class="work.type || 'work'">
            <div class="timeline-header">
              <h3 class="timeline-company">{{work.headline}}</h3>
              <img class="timeline-logo" ng-src="{{work.asset.media}}" alt="{{work.headline}} logo" />
            </div>
            <div class="timeline-title">{{work.title}}</div>
            <div class="timeline-meta">
              <span class="timeline-location">{{work.location}}</span>
              <span class="timeline-dates">{{work.startDate | dateSplit}} - {{work.endDate | dateSplit}}</span>
            </div>
            <div class="timeline-description" ng-show="work.text">
              <div ng-bind-html="work.text | formatText"></div>
            </div>
          </div>
        </div>
      </div>

      <footer class="footer">
        <div class="social-links">
          <a href="https://github.com/mahirk" target="_git"><i class="fa fa-github"></i></a>
          <a href="https://twitter.com/mahirk95" target="_twit"><i class="fa fa-twitter"></i></a>
          <a href="https://linkedin.com/in/mahirkothary/" target="_linked"><i class="fa fa-linkedin"></i></a>
        </div>
        <a href="mailto:mk@mahirk.com" class="email-link">mk@mahirk.com</a>
      </footer>
    </div>
  </body>
</html>
